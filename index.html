<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Kunlik hisobot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script>
    (function () {
      var t; try { t = localStorage.getItem('hisobot_theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark"></span>
        <span id="center-name" class="brand-name">Hisobot</span>
      </a>
      <nav id="tabs" class="tabs"></nav>
      <div class="top-actions">
        <span id="db-mode" class="pill"></span>
        <button id="theme-toggle" class="icon-btn" type="button" title="Tungi rejim"></button>
        <a id="settings-link" class="icon-btn" href="#/" title="Sozlamalar" hidden>
          <span class="icon-label">Sozlamalar</span>
        </a>
      </div>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/db.js?v=4"></script>
  <script src="js/icons.js?v=4"></script>
  <script src="js/util.js?v=4"></script>
  <script src="js/views.js?v=4"></script>
  <script src="js/sheet.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
